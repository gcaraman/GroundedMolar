name: Runtime security advisory check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-advisory:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned Windows Desktop runtime advisories
        shell: pwsh
        run: ./scripts/Test-RuntimeAdvisories.ps1
